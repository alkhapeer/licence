<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد مفاتيح Hero – بدون تخزين</title>
    <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            direction: rtl;
        }
        .card {
            background: #1e293b;
            max-width: 620px;
            width: 100%;
            border-radius: 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            color: #f1f5f9;
        }
        .card h1 {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            color: #facc15;
        }
        .card h1 small { font-size: 16px; font-weight: 400; color: #94a3b8; }
        .sub {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .field textarea, .field input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #334155;
            border-radius: 16px;
            font-size: 16px;
            background: #0f172a;
            color: #f1f5f9;
            transition: 0.2s;
            font-family: monospace;
            direction: ltr;
            text-align: left;
        }
        .field textarea { resize: vertical; min-height: 60px; }
        .field input:focus, .field textarea:focus {
            border-color: #facc15;
            outline: none;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.25);
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #334155;
            color: #f1f5f9;
        }
        .btn-primary { background: #facc15; color: #0f172a; }
        .btn-primary:hover { background: #eab308; }
        .btn-secondary { background: #334155; color: #f1f5f9; }
        .btn-secondary:hover { background: #475569; }
        .btn-success { background: #22c55e; color: #0f172a; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline {
            background: transparent;
            border: 2px solid #facc15;
            color: #facc15;
        }
        .btn-outline:hover { background: #facc15; color: #0f172a; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .row .col { flex: 1; min-width: 140px; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn-group .btn { flex: 1; min-width: 100px; font-size: 16px; padding: 14px; }
        .key-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            color: #e2e8f0;
            max-height: 100px;
            overflow-y: auto;
        }
        .key-box.public { border-color: #facc15; color: #facc15; }
        .msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            font-weight: 500;
            text-align: center;
            display: none;
        }
        .msg.error { display: block; background: #7f1d1d; color: #fca5a5; }
        .msg.success { display: block; background: #14532d; color: #86efac; }
        .msg.info { display: block; background: #1e3a5f; color: #93c5fd; }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🔐 مولّد مفاتيح Hero <small>بدون تخزين</small></h1>
    <div class="sub">توليد مفاتيح Ed25519 وعرضها مباشرة – لا يعتمد على <code>localStorage</code></div>

    <div class="row">
        <div class="col"><button id="btnGenerate" class="btn btn-primary">🔄 توليد مفاتيح جديدة</button></div>
        <div class="col"><button id="btnLoadPrivate" class="btn btn-outline">📂 تحميل مفتاح خاص</button>
            <input type="file" id="fileInput" accept=".key,.txt" style="display:none;">
        </div>
    </div>

    <div id="keysArea" style="display:none;">
        <div class="field">
            <label>🔓 المفتاح العام (انسخه وألصقه في نظام الحماية)</label>
            <div class="key-box public" id="pubKeyDisplay"></div>
            <button id="btnCopyPub" class="btn btn-secondary" style="margin-top:6px;">📋 نسخ المفتاح العام</button>
        </div>
        <div class="field">
            <label>🔒 المفتاح الخاص (احفظه في مكان آمن)</label>
            <div class="key-box" id="privKeyDisplay"></div>
            <button id="btnDownloadPriv" class="btn btn-danger" style="margin-top:6px;">⬇️ تحميل private.key</button>
        </div>
        <div id="matchMsg" class="msg" style="margin-top:10px;"></div>
        <button id="btnVerify" class="btn btn-secondary" style="margin-top:10px;">✅ تحقق من تطابق المفتاحين</button>
    </div>

    <div id="message" class="msg"></div>
    <div class="footer">⚡ يعمل دون اتصال · بدون تخزين محلي · Ed25519</div>
</div>

<script>
    (function() {
        'use strict';

        // ===== دوال مساعدة =====
        function base64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }

        function bytesToBase64(bytes) {
            let binary = '';
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ===== متغيرات المفاتيح =====
        let privateKeyBytes = null;   // Uint8Array (64)
        let publicKeyBytes = null;    // Uint8Array (32)
        let privateKeyBase64 = '';
        let publicKeyBase64 = '';

        // ===== دوال التوليد والاستيراد =====
        function generateNewKeys() {
            const keyPair = nacl.sign.keyPair();
            privateKeyBytes = keyPair.secretKey;
            publicKeyBytes = keyPair.publicKey;
            privateKeyBase64 = bytesToBase64(privateKeyBytes);
            publicKeyBase64 = bytesToBase64(publicKeyBytes);
        }

        function importPrivateKey(b64) {
            const bytes = base64ToBytes(b64);
            if (bytes.length !== 64) throw new Error('المفتاح الخاص يجب أن يكون 64 بايت');
            privateKeyBytes = bytes;
            publicKeyBytes = bytes.slice(0, 32);
            privateKeyBase64 = b64;
            publicKeyBase64 = bytesToBase64(publicKeyBytes);
        }

        // ===== التحقق من التطابق =====
        function areKeysMatching() {
            if (!privateKeyBytes || !publicKeyBytes) return false;
            const extractedPub = bytesToBase64(publicKeyBytes);
            return extractedPub === publicKeyBase64;
        }

        // ===== عناصر الواجهة =====
        const pubDisplay = document.getElementById('pubKeyDisplay');
        const privDisplay = document.getElementById('privKeyDisplay');
        const keysArea = document.getElementById('keysArea');
        const matchMsg = document.getElementById('matchMsg');
        const messageDiv = document.getElementById('message');

        const btnGenerate = document.getElementById('btnGenerate');
        const btnLoadPrivate = document.getElementById('btnLoadPrivate');
        const fileInput = document.getElementById('fileInput');
        const btnCopyPub = document.getElementById('btnCopyPub');
        const btnDownloadPriv = document.getElementById('btnDownloadPriv');
        const btnVerify = document.getElementById('btnVerify');

        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = 'msg ' + type;
            if (text) messageDiv.style.display = 'block';
            else messageDiv.style.display = 'none';
        }

        function displayKeys() {
            if (publicKeyBase64 && privateKeyBase64) {
                pubDisplay.textContent = publicKeyBase64;
                privDisplay.textContent = privateKeyBase64;
                keysArea.style.display = 'block';
                // تحقق من التطابق وعرض رسالة
                const match = areKeysMatching();
                if (match) {
                    matchMsg.textContent = '✅ المفتاحان متطابقان (الخاص يحتوي على العام).';
                    matchMsg.className = 'msg success';
                } else {
                    matchMsg.textContent = '❌ المفتاحان غير متطابقين! الخاص لا يحتوي على العام.';
                    matchMsg.className = 'msg error';
                }
                matchMsg.style.display = 'block';
                showMessage('المفاتيح جاهزة.', 'success');
            } else {
                keysArea.style.display = 'none';
                showMessage('⚠️ لا توجد مفاتيح. قم بتوليد أو تحميل مفتاح.', 'info');
            }
        }

        // ===== أحداث =====
        btnGenerate.addEventListener('click', function() {
            if (!confirm('⚠️ توليد مفاتيح جديدة سيلغي المفاتيح الحالية. هل أنت متأكد؟')) return;
            try {
                generateNewKeys();
                displayKeys();
                showMessage('✅ تم توليد مفاتيح جديدة.', 'success');
            } catch(e) {
                showMessage('❌ فشل التوليد: ' + e.message, 'error');
            }
        });

        btnLoadPrivate.addEventListener('click', function() {
            fileInput.click();
        });
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const cleaned = text.replace(/-----BEGIN.*?-----|-----END.*?-----|\s/g, '');
                if (!cleaned) throw new Error('الملف فارغ');
                importPrivateKey(cleaned);
                displayKeys();
                showMessage('✅ تم تحميل المفتاح الخاص.', 'success');
            } catch(err) {
                showMessage('❌ فشل التحميل: ' + err.message, 'error');
            }
            fileInput.value = '';
        });

        btnCopyPub.addEventListener('click', function() {
            const text = pubDisplay.textContent;
            if (!text) { showMessage('⚠️ لا يوجد مفتاح عام', 'error'); return; }
            navigator.clipboard.writeText(text).then(() => {
                showMessage('✅ تم نسخ المفتاح العام', 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showMessage('✅ تم نسخ المفتاح العام', 'success');
            });
        });

        btnDownloadPriv.addEventListener('click', function() {
            if (!privateKeyBase64) { showMessage('⚠️ لا يوجد مفتاح خاص', 'error'); return; }
            const blob = new Blob([privateKeyBase64], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'private.key';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showMessage('✅ تم تحميل المفتاح الخاص', 'success');
        });

        btnVerify.addEventListener('click', function() {
            const match = areKeysMatching();
            if (match) {
                matchMsg.textContent = '✅ المفتاحان متطابقان (الخاص يحتوي على العام).';
                matchMsg.className = 'msg success';
            } else {
                matchMsg.textContent = '❌ المفتاحان غير متطابقين! الخاص لا يحتوي على العام.';
                matchMsg.className = 'msg error';
            }
            matchMsg.style.display = 'block';
        });

        // ===== تهيئة الصفحة =====
        // لا يوجد تخزين محلي، نبدأ بدون مفاتيح.
        showMessage('💡 قم بتوليد مفاتيح جديدة أو تحميل مفتاح خاص.', 'info');
        keysArea.style.display = 'none';
    })();
</script>
</body>
</html>
