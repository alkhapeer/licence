<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta name="theme-color" content="#facc15">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>مولّد تفعيل Hero</title>
    
    <!-- رابط ملف تعريف التطبيق (PWA) -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/tweetnacl@1.0.3/nacl.min.js"></script>
    <style>
        /* ===== أنماط التطبيق ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            direction: rtl;
            /* منع التمرير الزائد */
            overflow-y: auto;
        }
        .card {
            background: #1e293b;
            max-width: 600px;
            width: 100%;
            border-radius: 32px;
            padding: 28px 24px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            color: #f1f5f9;
            /* تقليل الحواف للهواتف */
            margin: 8px 0;
        }
        .card h1 {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            color: #facc15;
        }
        .card h1 small { font-size: 16px; font-weight: 400; color: #94a3b8; }
        .sub {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-weight: 600;
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .field input, .field textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #334155;
            border-radius: 16px;
            font-size: 16px;
            background: #0f172a;
            color: #f1f5f9;
            transition: 0.2s;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            -webkit-appearance: none;
        }
        .field input:focus, .field textarea:focus {
            border-color: #facc15;
            outline: none;
            box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.25);
        }
        .field textarea { resize: vertical; min-height: 70px; font-size: 14px; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #334155;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background: #facc15; color: #0f172a; }
        .btn-primary:hover { background: #eab308; transform: scale(1.02); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: #334155; color: #f1f5f9; }
        .btn-secondary:hover { background: #475569; }
        .btn-success { background: #22c55e; color: #0f172a; }
        .btn-success:hover { background: #16a34a; }
        .btn-whatsapp { background: #25d366; color: #0f172a; }
        .btn-whatsapp:hover { background: #1ebe5d; }
        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-telegram:hover { background: #006699; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline {
            background: transparent;
            border: 2px solid #facc15;
            color: #facc15;
        }
        .btn-outline:hover { background: #facc15; color: #0f172a; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn-group .btn {
            flex: 1;
            font-size: 16px;
            padding: 14px;
            min-width: 100px;
        }
        .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .row .col { flex: 1; min-width: 140px; }
        .output-area {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }
        .output-area .label {
            font-weight: 600;
            font-size: 15px;
            color: #e2e8f0;
            margin-bottom: 6px;
        }
        .output-area .code-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 14px 16px;
            font-family: monospace;
            font-size: 14px;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            color: #facc15;
            min-height: 60px;
            margin-bottom: 12px;
            max-height: 200px;
            overflow-y: auto;
            user-select: all;
        }
        .msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            font-weight: 500;
            text-align: center;
            display: none;
        }
        .msg.error { display: block; background: #7f1d1d; color: #fca5a5; }
        .msg.success { display: block; background: #14532d; color: #86efac; }
        .msg.info { display: block; background: #1e3a5f; color: #93c5fd; }
        .hidden { display: none !important; }
        .key-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            margin-top: 6px;
            color: #e2e8f0;
            max-height: 100px;
            overflow-y: auto;
        }
        .key-box.public { border-color: #facc15; color: #facc15; }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
            text-align: center;
        }
        /* زر التثبيت (يظهر فقط في PWA) */
        #install-banner {
            display: none;
            background: #facc15;
            color: #0f172a;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        #install-banner:hover { background: #eab308; }
        #install-banner .close-btn {
            float: left;
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #0f172a;
        }
        @media (max-width: 480px) {
            .card { padding: 20px 16px; }
            .card h1 { font-size: 22px; }
            .btn { font-size: 16px; padding: 14px; }
            .btn-group .btn { min-width: 80px; font-size: 14px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- بنر التثبيت (يظهر فقط للمتصفحات التي تدعم PWA) -->
    <div id="install-banner">
        📲 قم بتثبيت التطبيق على هاتفك للوصول السريع
        <button class="close-btn" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
    </div>

    <h1>
        🔐 مولّد تفعيل Hero
        <small>PWA</small>
    </h1>
    <div class="sub">خاص بصاحب الدورة – يحفظ المفتاح الخاص لكل دورة تلقائياً</div>

    <!-- ===== القسم 1: إدارة المفاتيح ===== -->
    <div class="field">
        <label>🔑 معرف الدورة (Course ID)</label>
        <input type="text" id="courseIdInput" placeholder="مثل: 05bdc19c-7e3e-426e-90ce-f1617c5b4eb5" value="05bdc19c-7e3e-426e-90ce-f1617c5b4eb5">
        <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
            <button id="btnLoadCourse" class="btn btn-secondary" style="flex:1;">📂 تحميل مفتاح الدورة</button>
            <button id="btnDeleteCourse" class="btn btn-danger" style="flex:1;">🗑️ حذف مفتاح الدورة</button>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <button id="btnGenerateKeys" class="btn btn-secondary">🔄 توليد مفاتيح جديدة</button>
        </div>
        <div class="col">
            <button id="btnLoadPrivateKey" class="btn btn-outline">📂 تحميل مفتاح خاص</button>
            <input type="file" id="filePrivateKey" accept=".key,.txt" style="display:none;">
        </div>
    </div>

    <div id="keysArea" class="hidden">
        <div class="msg success" style="display:block;">✅ تم توليد/تحميل المفتاح الخاص لهذه الدورة</div>
        <div class="field">
            <label>🔓 المفتاح العام (انسخه وألصقه في نظام الحماية بالدورة)</label>
            <div class="key-box public" id="publicKeyDisplay"></div>
            <button id="btnCopyPublic" class="btn btn-secondary" style="margin-top:6px;">📋 نسخ المفتاح العام</button>
        </div>
        <div class="field">
            <label>🔒 المفتاح الخاص (محفوظ تلقائياً لهذه الدورة)</label>
            <div class="key-box" id="privateKeyDisplay"></div>
            <button id="btnDownloadPrivate" class="btn btn-danger" style="margin-top:6px;">⬇️ تحميل private.key</button>
        </div>
    </div>

    <!-- ===== القسم 2: توليد الترخيص ===== -->
    <div class="field">
        <label>📱 مفتاح العميل (Device ID)</label>
        <input type="text" id="deviceKeyInput" placeholder="الصق المفتاح الذي أرسله العميل..." dir="ltr">
    </div>

    <button id="generateBtn" class="btn btn-primary">🔑 توليد كود التفعيل</button>

    <!-- ===== منطقة عرض الكود ===== -->
    <div class="output-area" id="outputArea" style="display:none;">
        <div class="label">✅ كود التفعيل</div>
        <div class="code-box" id="activationCodeDisplay"></div>
        <div class="btn-group">
            <button id="copyBtn" class="btn btn-success">📋 نسخ الكود</button>
            <button id="whatsappBtn" class="btn btn-whatsapp">💬 واتساب</button>
            <button id="telegramBtn" class="btn btn-telegram">💬 تيليجرام</button>
        </div>
        <button id="clearBtn" class="btn btn-secondary" style="margin-top:10px;">🧹 مسح</button>
    </div>

    <!-- ===== رسائل ===== -->
    <div id="message" class="msg"></div>

    <div class="footer">
        ⚡ يعمل دون اتصال · يحفظ المفاتيح لكل دورة · قابل للتثبيت على الهاتف
    </div>
</div>

<!-- ============================================================ -->
<script>
    (function() {
        'use strict';

        // ====================================================================
        // 📌 تسجيل Service Worker (لـ PWA)
        // ====================================================================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('✅ Service Worker مسجل'))
                .catch(err => console.error('❌ فشل تسجيل Service Worker:', err));
        }

        // ====================================================================
        // 📌 عرض بنر التثبيت (في حالة توفر PWA)
        // ====================================================================
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const banner = document.getElementById('install-banner');
            banner.style.display = 'block';
            banner.addEventListener('click', () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('✅ تم تثبيت التطبيق');
                        } else {
                            console.log('❌ تم رفض التثبيت');
                        }
                        deferredPrompt = null;
                        banner.style.display = 'none';
                    });
                }
            });
        });

        // ====================================================================
        // 📌 دوال مساعدة
        // ====================================================================
        function base64ToBytes(b64) {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return bytes;
        }
        function bytesToBase64(bytes) {
            return btoa(String.fromCharCode.apply(null, bytes));
        }
        function generateUUID() {
            if (crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = crypto.getRandomValues(new Uint8Array(1))[0] % 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        // ====================================================================
        // 🔑 إدارة المفاتيح (Ed25519) مع التخزين حسب Course ID
        // ====================================================================
        const STORAGE_KEY_PREFIX = 'hero_keys_';

        let privateKeyBytes = null;
        let publicKeyBytes = null;
        let privateKeyBase64 = '';
        let publicKeyBase64 = '';
        let currentCourseId = '';

        function getStorageKey(courseId) {
            return STORAGE_KEY_PREFIX + courseId;
        }

        function saveKeysToStorage(courseId, privB64, pubB64) {
            if (!courseId) return;
            const data = { privateKey: privB64, publicKey: pubB64 };
            localStorage.setItem(getStorageKey(courseId), JSON.stringify(data));
        }

        function loadKeysFromStorage(courseId) {
            if (!courseId) return null;
            const raw = localStorage.getItem(getStorageKey(courseId));
            if (!raw) return null;
            try {
                return JSON.parse(raw);
            } catch { return null; }
        }

        function deleteKeysFromStorage(courseId) {
            if (!courseId) return;
            localStorage.removeItem(getStorageKey(courseId));
        }

        function loadKeysForCourse(courseId) {
            const data = loadKeysFromStorage(courseId);
            if (data && data.privateKey && data.publicKey) {
                const success = importPrivateKeyFromBase64(data.privateKey);
                if (success) {
                    publicKeyBase64 = data.publicKey;
                    return true;
                }
            }
            return false;
        }

        function generateKeyPair() {
            const keyPair = nacl.sign.keyPair();
            privateKeyBytes = keyPair.secretKey;
            publicKeyBytes = keyPair.publicKey;
            privateKeyBase64 = bytesToBase64(privateKeyBytes);
            publicKeyBase64 = bytesToBase64(publicKeyBytes);
            return { privateKeyBase64, publicKeyBase64 };
        }

        function importPrivateKeyFromBase64(b64) {
            try {
                const bytes = base64ToBytes(b64);
                if (bytes.length !== 64) throw new Error('المفتاح الخاص يجب أن يكون 64 بايت');
                privateKeyBytes = bytes;
                publicKeyBytes = bytes.slice(0, 32);
                privateKeyBase64 = b64;
                publicKeyBase64 = bytesToBase64(publicKeyBytes);
                return true;
            } catch(e) {
                console.error('خطأ في استيراد المفتاح الخاص:', e);
                return false;
            }
        }

        // ====================================================================
        // 🔏 التوقيع
        // ====================================================================
        function signPayload(payloadObject) {
            const payloadJson = JSON.stringify(payloadObject);
            const payloadBytes = new TextEncoder().encode(payloadJson);
            const signature = nacl.sign.detached(payloadBytes, privateKeyBytes);
            const payloadBase64 = bytesToBase64(payloadBytes);
            const signatureBase64 = bytesToBase64(signature);
            return { payloadBase64, signatureBase64, payloadJson };
        }

        // ====================================================================
        // 🧪 توليد كود التفعيل
        // ====================================================================
        function generateActivationCode(deviceKey, courseId, version = '1.0.0') {
            if (!privateKeyBytes) {
                throw new Error('المفتاح الخاص غير موجود. قم بتوليد أو تحميل مفتاح أولاً.');
            }

            const payload = {
                course_id: courseId,
                device_binding: deviceKey.trim(),
                license_id: generateUUID().substring(0, 8),
                issued_at: new Date().toISOString(),
                version: version
            };

            const { payloadBase64, signatureBase64 } = signPayload(payload);
            return payloadBase64 + '.' + signatureBase64;
        }

        // ====================================================================
        // 🖥️ عناصر الواجهة
        // ====================================================================
        const courseIdInput = document.getElementById('courseIdInput');
        const deviceKeyInput = document.getElementById('deviceKeyInput');
        const generateBtn = document.getElementById('generateBtn');
        const outputArea = document.getElementById('outputArea');
        const activationCodeDisplay = document.getElementById('activationCodeDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const whatsappBtn = document.getElementById('whatsappBtn');
        const telegramBtn = document.getElementById('telegramBtn');
        const clearBtn = document.getElementById('clearBtn');
        const messageDiv = document.getElementById('message');

        const btnGenKeys = document.getElementById('btnGenerateKeys');
        const btnLoadPriv = document.getElementById('btnLoadPrivateKey');
        const fileInput = document.getElementById('filePrivateKey');
        const keysArea = document.getElementById('keysArea');
        const publicDisplay = document.getElementById('publicKeyDisplay');
        const privateDisplay = document.getElementById('privateKeyDisplay');
        const btnCopyPublic = document.getElementById('btnCopyPublic');
        const btnDownloadPrivate = document.getElementById('btnDownloadPrivate');
        const btnLoadCourse = document.getElementById('btnLoadCourse');
        const btnDeleteCourse = document.getElementById('btnDeleteCourse');

        // ====================================================================
        // 📨 عرض الرسائل
        // ====================================================================
        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = 'msg ' + type;
            if (text) messageDiv.style.display = 'block';
            else messageDiv.style.display = 'none';
        }

        // ====================================================================
        // 🔄 تحديث حالة المفاتيح بناءً على Course ID الحالي
        // ====================================================================
        function refreshKeysForCurrentCourse() {
            const courseId = courseIdInput.value.trim();
            if (!courseId) {
                keysArea.classList.add('hidden');
                showMessage('⚠️ الرجاء إدخال معرف الدورة.', 'info');
                generateBtn.disabled = true;
                return;
            }

            currentCourseId = courseId;
            const loaded = loadKeysForCourse(courseId);
            if (loaded) {
                publicDisplay.textContent = publicKeyBase64;
                privateDisplay.textContent = privateKeyBase64;
                keysArea.classList.remove('hidden');
                showMessage(`✅ تم تحميل المفتاح الخاص للدورة: ${courseId}`, 'success');
                generateBtn.disabled = false;
            } else {
                keysArea.classList.add('hidden');
                showMessage(`⚠️ لا يوجد مفتاح محفوظ للدورة: ${courseId}. قم بتوليد أو تحميل مفتاح.`, 'info');
                generateBtn.disabled = true;
            }
        }

        // ====================================================================
        // 🔐 توليد مفاتيح جديدة وحفظها
        // ====================================================================
        btnGenKeys.addEventListener('click', function() {
            const courseId = courseIdInput.value.trim();
            if (!courseId) {
                showMessage('⚠️ الرجاء إدخال معرف الدورة أولاً.', 'error');
                return;
            }
            try {
                if (typeof nacl === 'undefined') {
                    showMessage('❌ مكتبة التشفير غير محملة. تأكد من اتصال الإنترنت.', 'error');
                    return;
                }
                const keys = generateKeyPair();
                saveKeysToStorage(courseId, privateKeyBase64, publicKeyBase64);
                publicDisplay.textContent = publicKeyBase64;
                privateDisplay.textContent = privateKeyBase64;
                keysArea.classList.remove('hidden');
                showMessage(`✅ تم توليد مفاتيح جديدة وحفظها للدورة: ${courseId}`, 'success');
                generateBtn.disabled = false;
                currentCourseId = courseId;
            } catch(e) {
                showMessage('❌ فشل توليد المفاتيح: ' + e.message, 'error');
            }
        });

        // ====================================================================
        // 📂 تحميل مفتاح خاص من ملف وحفظه
        // ====================================================================
        btnLoadPriv.addEventListener('click', function() {
            fileInput.click();
        });
        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const courseId = courseIdInput.value.trim();
            if (!courseId) {
                showMessage('⚠️ الرجاء إدخال معرف الدورة أولاً.', 'error');
                fileInput.value = '';
                return;
            }
            try {
                const text = await file.text();
                const cleaned = text.replace(/-----BEGIN.*?-----|-----END.*?-----|\s/g, '');
                if (!cleaned) {
                    showMessage('⚠️ الملف فارغ أو غير صالح', 'error');
                    return;
                }
                const success = importPrivateKeyFromBase64(cleaned);
                if (!success) {
                    showMessage('❌ فشل استيراد المفتاح الخاص. تأكد من أنه بصيغة Base64 لـ Ed25519 (64 بايت).', 'error');
                    return;
                }
                saveKeysToStorage(courseId, privateKeyBase64, publicKeyBase64);
                publicDisplay.textContent = publicKeyBase64;
                privateDisplay.textContent = privateKeyBase64;
                keysArea.classList.remove('hidden');
                showMessage(`✅ تم تحميل وحفظ المفتاح الخاص للدورة: ${courseId}`, 'success');
                generateBtn.disabled = false;
                currentCourseId = courseId;
            } catch(err) {
                showMessage('❌ خطأ في قراءة الملف: ' + err.message, 'error');
            }
            fileInput.value = '';
        });

        // ====================================================================
        // 📂 تحميل مفتاح الدورة المحفوظ
        // ====================================================================
        btnLoadCourse.addEventListener('click', function() {
            refreshKeysForCurrentCourse();
        });

        // ====================================================================
        // 🗑️ حذف مفتاح الدورة المحفوظ
        // ====================================================================
        btnDeleteCourse.addEventListener('click', function() {
            const courseId = courseIdInput.value.trim();
            if (!courseId) {
                showMessage('⚠️ الرجاء إدخال معرف الدورة.', 'error');
                return;
            }
            if (!confirm(`هل أنت متأكد من حذف المفتاح الخاص للدورة: ${courseId}؟`)) return;
            deleteKeysFromStorage(courseId);
            keysArea.classList.add('hidden');
            showMessage(`🗑️ تم حذف المفتاح الخاص للدورة: ${courseId}`, 'info');
            generateBtn.disabled = true;
            currentCourseId = '';
        });

        // ====================================================================
        // 📋 نسخ المفتاح العام
        // ====================================================================
        btnCopyPublic.addEventListener('click', function() {
            const text = publicDisplay.textContent;
            if (!text) { showMessage('⚠️ لا يوجد مفتاح عام لنسخه', 'error'); return; }
            navigator.clipboard.writeText(text).then(() => {
                showMessage('✅ تم نسخ المفتاح العام', 'success');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showMessage('✅ تم نسخ المفتاح العام', 'success');
            });
        });

        // ====================================================================
        // ⬇️ تحميل المفتاح الخاص
        // ====================================================================
        btnDownloadPrivate.addEventListener('click', function() {
            if (!privateKeyBase64) {
                showMessage('⚠️ لا يوجد مفتاح خاص لتحميله', 'error');
                return;
            }
            const content = privateKeyBase64;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'private.key';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showMessage('✅ تم تحميل الملف', 'success');
        });

        // ====================================================================
        // 🎫 توليد كود التفعيل
        // ====================================================================
        generateBtn.addEventListener('click', function() {
            if (!privateKeyBytes) {
                showMessage('⚠️ يرجى توليد أو تحميل مفتاح خاص أولاً.', 'error');
                return;
            }

            const deviceKey = deviceKeyInput.value.trim();
            if (!deviceKey) {
                showMessage('⚠️ الرجاء إدخال مفتاح العميل (Device ID).', 'error');
                return;
            }

            const courseId = courseIdInput.value.trim() || 'default-course';

            try {
                const code = generateActivationCode(deviceKey, courseId);
                activationCodeDisplay.textContent = code;
                outputArea.style.display = 'block';
                showMessage('✅ تم توليد كود التفعيل بنجاح. انسخه وأرسله للعميل.', 'success');

                const range = document.createRange();
                range.selectNodeContents(activationCodeDisplay);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);

            } catch(e) {
                showMessage('❌ خطأ: ' + e.message, 'error');
            }
        });

        // ====================================================================
        // 📋 نسخ الكود
        // ====================================================================
        copyBtn.addEventListener('click', function() {
            const code = activationCodeDisplay.textContent;
            if (!code) {
                showMessage('⚠️ لا يوجد كود لنسخه', 'error');
                return;
            }
            navigator.clipboard.writeText(code).then(() => {
                showMessage('✅ تم نسخ الكود إلى الحافظة', 'success');
                copyBtn.textContent = '✅ تم النسخ';
                setTimeout(() => copyBtn.textContent = '📋 نسخ الكود', 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = code;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showMessage('✅ تم نسخ الكود', 'success');
                copyBtn.textContent = '✅ تم النسخ';
                setTimeout(() => copyBtn.textContent = '📋 نسخ الكود', 2000);
            });
        });

        // ====================================================================
        // 💬 واتساب
        // ====================================================================
        whatsappBtn.addEventListener('click', function() {
            const code = activationCodeDisplay.textContent;
            const deviceKey = deviceKeyInput.value.trim();
            const courseId = courseIdInput.value.trim() || 'default-course';
            const waNumber = prompt('أدخل رقم واتساب مع رمز الدولة:', '249915886600');
            if (waNumber) {
                const msg = encodeURIComponent(
                    'مرحباً، هذا هو كود التفعيل الخاص بك:\n' +
                    'كود التفعيل: ' + code + '\n' +
                    'معرف الدورة: ' + courseId + '\n' +
                    'مفتاح الجهاز: ' + deviceKey
                );
                window.open('https://wa.me/' + waNumber + '?text=' + msg, '_blank');
            }
        });

        // ====================================================================
        // 💬 تيليجرام
        // ====================================================================
        telegramBtn.addEventListener('click', function() {
            const code = activationCodeDisplay.textContent;
            const deviceKey = deviceKeyInput.value.trim();
            const courseId = courseIdInput.value.trim() || 'default-course';
            const username = prompt('أدخل معرف تيليجرام الخاص بك (بدون @):', 'Herocourses');
            if (username) {
                const msg = encodeURIComponent(
                    'مرحباً، هذا هو كود التفعيل الخاص بك:\n' +
                    'كود التفعيل: ' + code + '\n' +
                    'معرف الدورة: ' + courseId + '\n' +
                    'مفتاح الجهاز: ' + deviceKey
                );
                window.open('https://t.me/' + username + '?text=' + msg, '_blank');
            }
        });

        // ====================================================================
        // 🧹 مسح
        // ====================================================================
        clearBtn.addEventListener('click', function() {
            deviceKeyInput.value = '';
            outputArea.style.display = 'none';
            activationCodeDisplay.textContent = '';
            showMessage('🧹 تم المسح', 'info');
            deviceKeyInput.focus();
        });

        // ====================================================================
        // 🚀 التهيئة الأولية
        // ====================================================================
        if (typeof nacl === 'undefined') {
            showMessage('❌ مكتبة التشفير غير محملة. تأكد من اتصال الإنترنت.', 'error');
            generateBtn.disabled = true;
            btnGenKeys.disabled = true;
        } else {
            const defaultCourse = courseIdInput.value.trim();
            if (defaultCourse) {
                const loaded = loadKeysForCourse(defaultCourse);
                if (loaded) {
                    publicDisplay.textContent = publicKeyBase64;
                    privateDisplay.textContent = privateKeyBase64;
                    keysArea.classList.remove('hidden');
                    showMessage(`✅ تم تحميل المفتاح المحفوظ للدورة: ${defaultCourse}`, 'success');
                    generateBtn.disabled = false;
                    currentCourseId = defaultCourse;
                } else {
                    showMessage('💡 أدخل معرف الدورة، ثم قم بتوليد أو تحميل مفتاح خاص.', 'info');
                    generateBtn.disabled = true;
                }
            } else {
                showMessage('💡 أدخل معرف الدورة، ثم قم بتوليد أو تحميل مفتاح خاص.', 'info');
                generateBtn.disabled = true;
            }
        }

        courseIdInput.addEventListener('change', refreshKeysForCurrentCourse);
        courseIdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') refreshKeysForCurrentCourse();
        });

        console.log('[Generator] PWA جاهز للتثبيت على الهاتف');
    })();
</script>
</body>
</html>
